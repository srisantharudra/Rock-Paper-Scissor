<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <h1>Rock Paper Scissor</h1>
    <div id="b">
        <button class="button" id="Rock"><i class="fa-solid fa-hand-fist"></i></button>
        <button class="button" id="paper"><i class="fa-sharp fa-solid fa-hand"></i></button>
        <button class="button" id="scissor"><i class="fa-solid fa-hand-peace"></i></button>
    </div>
    <div id="scoreboard">
    <h4>You</h4>
    <h4>Comp</h4>
    </div>
    <div id="scorepoints">
    <h4 id="userscore">0</h4>
    <h4 id="compscore">0</h4>
    </div>
    <div id="move">
    <button id="start">Pick Your Move</button>
    </div>
    <script src="logic.js"></script>
</body>
</html>
